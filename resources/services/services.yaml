# The persistent resources an experiment host needs, managed by `python -m sprout.services`
# (docs/SERVICES.md). `init` wrote this file and never overwrites it: edit it freely.
#
# Placeholders, expanded when a command runs:
#   {python}        the interpreter `python:` below names (null: the checkout's .venv/bin/python)
#   {repo}          the checkout this package was imported from
#   {config}        this file's directory (~/.config/sprout)
#   {state}         the state directory (~/.local/state/sprout/services): pid and log per
#                   service, secrets/, the proxy's venv, the database's data
#   {secret:NAME}   a generated secret, <state>/secrets/NAME (mode 0600); `init` makes them,
#                   `env` is the only command that prints one. Allowed in env, exports and
#                   health.headers only: a command, prepare step, volume, publish, health URL
#                   or path is logged and echoed as typed, so the loader refuses a secret there.
#   {env:NAME}      a variable of the shell running the CLI
#   {podman_bin}    the podman the sandboxes run on, as `{python} -m sprout.worker doctor` resolves
#                   it: $SPROUT_PODMAN_BIN, else the podman 6 under ~/.local/opt/podman, else `podman`
#   {store}         their btrfs store, as the doctor resolves it: $SPROUT_PODMAN_STORE, else ~/sprout-btrfs
# A leading ~ is the home directory. A bare program name is looked up on PATH, then in
# ~/.local/bin (where uv's installer puts it). A container's `image` and `container` are used
# as written (the name is what every podman verb looks the container up by).
#
# A process receives its own `exports` and those of every service it depends on,
# transitively, plus its `env`; `env` prints every service's exports as shell export lines,
# which is how an experiment shell consumes them. `up` starts a service only when its health
# probe fails, dependencies first; `down` stops dependents first. `enabled: false` leaves a
# service out of a bare `up`, `status` and `doctor`; naming it (`up aenv`) still acts on it.
#
# kinds: process (started detached; pid and log under {state}/<name>), podman (a container),
# external (started by hand; `up` prints start_hint), check (a host fact the worker's doctor verifies).
# health kinds: http (GET must answer 200), pg_isready, process (the pid is alive and ours),
# none.

python: null

services:
  # The Run Store's PostgreSQL in rootless podman. The host's own PostgreSQL owns 5432, so
  # this one is published on 127.0.0.1:15432. Its data directory is a bind mount that
  # survives `down` (podman stop) and a reboot (`up` is then podman start).
  db:
    kind: podman
    image: docker.io/library/postgres:16-alpine
    container: sprout-services-db
    publish: "127.0.0.1:15432:5432"
    port: 15432
    volumes:
      - "{state}/db/data:/var/lib/postgresql/data:Z"
    env:
      POSTGRES_USER: sprout_runstore
      POSTGRES_DB: sprout_runstore
      POSTGRES_PASSWORD: "{secret:db-password}"
    health:
      kind: pg_isready        # the host's pg_isready; `podman exec` in the container without it
      host: 127.0.0.1
      port: 15432
      user: sprout_runstore
    exports:
      SPROUT_RUNSTORE_DSN: "host=127.0.0.1 port=15432 dbname=sprout_runstore user=sprout_runstore password={secret:db-password}"

  # LiteLLM in front of the providers Sprout cannot talk to directly -- a native messages
  # API, a model reached only through a provider SDK, a service tier the Chat Completions
  # route cannot select -- as one OpenAI-compatible URL with one key (docs/MODEL_ENDPOINTS.md).
  # It runs from a venv of its own, made with uv on the first `up`, because litellm pins
  # another httpx and pydantic than sprout. Aliases and routes: {config}/litellm.yaml; a
  # provider SDK litellm does not bundle is appended to the install line below.
  proxy:
    kind: process
    prepare:
      - unless: "{state}/litellm-env/bin/python"
        run: [uv, venv, --python, "3.12", "{state}/litellm-env"]
      - unless: "{state}/litellm-env/bin/litellm"
        run: [uv, pip, install, --python, "{state}/litellm-env/bin/python", "litellm[proxy]==1.103.0"]
    command: ["{state}/litellm-env/bin/litellm", --config, "{config}/litellm.yaml", --host, 127.0.0.1, --port, "4000"]
    port: 4000
    env:
      LITELLM_MASTER_KEY: "{secret:litellm-master-key}"
    # Removed from the proxy's environment: FORCE_COLOR would colour the log. Add a
    # provider variable here when one left in the shell must not reach the proxy.
    unset_env: [FORCE_COLOR]
    health: {kind: http, url: "http://127.0.0.1:4000/health/liveliness"}
    timeout_s: 120          # it imports for a while before it listens
    exports:
      OPENAI_BASE_URL: http://127.0.0.1:4000/v1
      OPENAI_API_KEY: "{secret:litellm-master-key}"
      SPROUT_LITELLM_KEY: "{secret:litellm-master-key}"

  # The Run Store API (docs/RUNSTORE.md). `sprout.runstore init` is idempotent and runs before
  # every start; it refuses a volatile artifact_root, so keep the one in {config}/runstore.json
  # under a real directory. The probe is an authenticated GET: there is no /health route.
  runstore-api:
    kind: process
    depends_on: [db]
    prepare:
      - run: ["{python}", -m, sprout.runstore, init, --config, "{config}/runstore.json"]
    command: ["{python}", -m, sprout.runstore, serve, --config, "{config}/runstore.json", --host, 127.0.0.1, --port, "18110"]
    port: 18110
    health:
      kind: http
      url: http://127.0.0.1:18110/v1/jobs
      headers: {Authorization: "Bearer {secret:runstore-token}"}
    exports:
      SPROUT_RUNSTORE_TOKEN: "{secret:runstore-token}"

  runstore-worker:
    kind: process
    # podman and store: their exports (SPROUT_PODMAN_BIN, SPROUT_PODMAN_STORE) reach the worker,
    # so its sandboxes run on the same podman and store an experiment shell gets from `env`.
    depends_on: [runstore-api, podman, store]
    command: ["{python}", -m, sprout.worker, start, --config, "{config}/runstore.json", --concurrency, "1"]
    health: {kind: process}

  # The Miles adapter over the Run Store (docs/RL_DRIVER.md); tasks and profiles in
  # {config}/rl_driver.json.
  rl-driver:
    kind: process
    depends_on: [runstore-api]
    command: ["{python}", -m, sprout.rl_driver, --config, "{config}/rl_driver.json", --host, 127.0.0.1, --port, "11001"]
    port: 11001
    # /health sits behind the driver token like every other route (rl_driver/server.py),
    # so the probe must carry it or a healthy driver reads as down (HTTP 401).
    health:
      kind: http
      url: http://127.0.0.1:11001/health
      headers: {Authorization: "Bearer {secret:rl-driver-token}"}
    exports:
      SPROUT_RL_DRIVER_TOKEN: "{secret:rl-driver-token}"

  # The podman the sandboxes run on: the worker's doctor checks that it answers --version, and
  # nothing starts it. null is the podman every run uses: $SPROUT_PODMAN_BIN, else the podman 6
  # ops/setup_podman.sh installs under ~/.local/opt/podman, else `podman` on PATH. `env` exports
  # the doctor's resolved path so every entry point in that shell runs the same one.
  podman:
    kind: check
    check: podman
    path: null
    exports:
      SPROUT_PODMAN_BIN: "{podman_bin}"

  # The podman backend's btrfs store: the worker's doctor checks it, nothing starts it. null is
  # $SPROUT_PODMAN_STORE, else ~/sprout-btrfs, the default every entry point uses; `env` exports it.
  store:
    kind: check
    check: btrfs_store
    path: null
    exports:
      SPROUT_PODMAN_STORE: "{store}"

  # The AgentENV microVM server (--backend microvm). It runs as root, so `up aenv` prints the
  # start commands of start_hint instead of running them. Enable it on a host that has the service.
  aenv:
    kind: external
    enabled: false
    port: 18000
    health:
      kind: http
      url: "{env:AENV_SERVER_URL}/sandboxes"
      headers: {X-API-Key: "{env:AENV_API_KEY}"}
    start_hint: |
      # 1. ublk module gone after a reboot? Rebuild it against the running kernel first.
      cd <ublk_drv source directory>
      make -C /usr/src/kernels/$(uname -r) M=$PWD modules
      sudo cp ublk_drv.ko /lib/modules/$(uname -r)/extra/ && sudo depmod -a
      sudo modprobe ublk_drv
      # 2. start the bench instance (setsid so a later shell mishap cannot kill it)
      sudo setsid env \
        AENV_CONFIG_PATH=/opt/aenv-bench/config.toml \
        AENV_HOME_PATH=/opt/aenv-bench/home \
        AENV_RUNTIME_PATH=/opt/aenv-bench/run \
        AENV_DEPS_PATH=/var/lib/aenv/deps \
        API_ADDR=127.0.0.1:18000 \
        AENV_API_KEY="$AENV_API_KEY" RUST_LOG=info \
        /opt/aenv-bench/bin/server >> ~/aenv-bench/server.log 2>&1 < /dev/null &
      curl -s -H "X-API-Key: $AENV_API_KEY" http://127.0.0.1:18000/sandboxes
