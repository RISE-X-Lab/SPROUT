name: CI

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main, dev]

jobs:
  go-build:
    name: Go Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go mod download
      # The ripgrep release grep_files embeds; not in git, so fetched first.
      - run: go generate ./...
      - run: go test ./...
      - run: go build -o sprout-runtime .
      - run: go vet ./...

  go-test:
    name: Go Integration Test
    runs-on: ubuntu-latest
    needs: go-build
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go generate ./... && go build -o sprout-runtime .

      - name: Serve JSON-RPC over HTTP and call shell
        run: |
          ./sprout-runtime --port 19876 &
          sleep 2
          curl -sf -X POST http://localhost:19876 -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | python3 -c "
          import sys, json
          tools = json.loads(sys.stdin.read())['result']
          names = [t['name'] for t in tools]
          expected = ['shell', 'text_editor', 'grep_files', 'web_fetch', 'web_search']
          assert names == expected, f'Expected {expected}, got {names}'
          print('OK: the runtime serves its five tools')
          "
          curl -sf -X POST http://localhost:19876 -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"shell","arguments":{"command":"echo http_ok"}}}' | python3 -c "
          import sys, json
          data = json.loads(sys.stdin.read())
          assert data['result']['content'][0]['text'].strip() == 'http_ok'
          assert data['result']['isError'] is False
          assert 'notifications' not in data['result']
          print('OK: shell over HTTP works')
          "
          kill %1 2>/dev/null || true

  python:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: go-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The package with every optional layer: the pinned agent and trial runner,
      # the Run Store / RL services. No model or dataset client is needed to test.
      - run: pip install -e ".[mini,harbor,runstore,rl,dev]"

      # ToolAccess validates calls against runtime/schema/tools.json, which is
      # generated by this binary. Built here so the drift checks below have something
      # authoritative to compare with -- without it they skip, which is the one way
      # this job could pass while saying nothing.
      - name: Build sprout-runtime
        working-directory: runtime
        run: go generate ./... && go build -o sprout-runtime .

      # The pre-commit gates (gate/README.md), here too because a hook can be skipped.
      # After the install and the build: the gates run ruff, mypy and the runtime.
      - name: Gates
        run: ./gate/run.sh

      # The client the harness uses behind AgentENV's proxy, pointed straight at
      # that bare runtime (which ignores the routing headers): the one place the
      # Python parse meets a live Go response rather than a canned one.
      - name: The Python client against the live runtime
        run: |
          ./runtime/sprout-runtime --port 19879 &
          sleep 2
          python3 -c "
          import asyncio
          from sprout_sandbox import GatewayBackend, Sandbox

          async def main():
              sb = Sandbox(backend=GatewayBackend('http://localhost:19879', sandbox_id='local'))
              try:
                  r = await sb.call('shell', command='echo client_http')
                  assert 'client_http' in r.output, f'HTTP failed: {r.output}'
                  failed = await sb.call('shell', command='echo oops >&2; exit 3')
                  assert failed.exit_code == 3 and failed.stderr.strip() == 'oops', failed
              finally:
                  await sb.backend.close()
              print('PYTHON CLIENT OK')

          asyncio.run(main())
          "
          kill %1 2>/dev/null || true

      - name: Test every layer (testpaths in pyproject.toml)
        run: python3 -m pytest -q

      - name: Upstream contracts (mini-swe-agent, Harbor)
        run: python3 ops/contracts/ci_check.py

      # Asserted, not assumed. The check that keeps the checked-in schema honest
      # skips when go is not on PATH, and a skipped guard reads exactly like a
      # passing one in the summary.
      - name: The drift check actually ran
        run: |
          python3 -m pytest tests/worker/tools/test_schema.py -q \
            -k "declaration_matches_what_the_runtime_declares" -rs --no-header | tee /tmp/drift.txt
          if grep -q -i "skipped" /tmp/drift.txt; then
            echo "::error::the runtime drift check skipped; it needs go on PATH"
            exit 1
          fi
          grep -q "1 passed" /tmp/drift.txt
